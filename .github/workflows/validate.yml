# This workflow will make sure the code is linted and valid

name: Validate

on:
  push:
    branches:
      - '**'
      - '!main'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  oxlint:
    name: Lint JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          install: false
      - run: pnpm dlx oxlint@latest --deny-warnings # change to the latest release
